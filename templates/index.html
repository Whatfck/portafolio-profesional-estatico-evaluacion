<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolios Profesionales</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .portfolio-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .portfolio-link {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .portfolio-link:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.6);
        }

        .info {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #eee;
            color: #666;
            font-size: 0.95em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Portafolios Profesionales</h1>
        <p class="subtitle">Sistema de Portafolios Estáticos - Proyecto Django Colaborativo</p>
        
        <div class="portfolio-links">
            <a href="{% url 'dev1:portfolio' %}" class="portfolio-link">Dev 1</a>
            <a href="{% url 'dev2:portfolio' %}" class="portfolio-link">Dev 2</a>
            <a href="{% url 'dev3:portfolio' %}" class="portfolio-link">Dev 3</a>
        </div>

        <div class="info">
            <p><strong>Instrucciones:</strong> Cada desarrollador debe crear su propia rama feature y desarrollar su portafolio independientemente.</p>
        </div>
    </div>
</body>
</html>
